<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - مستلزمات أطفال</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="register-header">
                <div class="logo-icon">🍼</div>
                <h2>مرحباً بعودتك</h2>
                <p>سجل دخولك لمتابعة التسوق</p>
            </div>

            <form id="loginForm" action="#">
                <div class="form-group">
                    <label for="loginEmail">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" name="email" required placeholder="example@mail.com">
                </div>

                <div class="form-group">
                    <label for="loginPassword">كلمة المرور</label>
                    <input type="password" id="loginPassword" name="password" required placeholder="********">
                </div>

                <button type="submit" class="btn btn-primary btn-block">دخول</button>
            </form>

            <div class="login-link">
                ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
